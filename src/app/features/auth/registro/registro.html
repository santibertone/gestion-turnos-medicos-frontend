<div class="auth">
  <mat-card class="auth__card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>Crear cuenta</mat-card-title>
      <mat-card-subtitle>Registrate como paciente para sacar turnos</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      @if (errorBackend(); as error) {
        <div class="auth__error" role="alert">
          <mat-icon>error_outline</mat-icon>
          <span>{{ error }}</span>
        </div>
      }

      <app-paciente-form />

      <button
        mat-flat-button
        class="auth__submit"
        (click)="enviar()"
        [disabled]="cargando()"
      >
        @if (cargando()) {
          <mat-spinner diameter="20" />
        } @else {
          <span><mat-icon>person_add</mat-icon> Crear cuenta</span>
        }
      </button>
    </mat-card-content>

    <mat-card-footer class="auth__footer">
      <span>Ya tenes cuenta?</span>
      <a routerLink="/login">Inicia sesion</a>
    </mat-card-footer>
  </mat-card>
</div>
