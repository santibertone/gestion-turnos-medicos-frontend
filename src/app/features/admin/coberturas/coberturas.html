<div class="pagina">
  <div class="pagina__header">
    <h1 class="pagina__titulo"><mat-icon>health_and_safety</mat-icon> Coberturas</h1>
    <button mat-flat-button (click)="abrirForm()">
      <mat-icon>add</mat-icon> Nueva cobertura
    </button>
  </div>

  <div class="barra-filtros">
    <mat-form-field appearance="outline">
      <mat-label>Buscar</mat-label>
      <input matInput #f (input)="filtro.set(f.value)" placeholder="Nombre..." />
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>
  </div>

  @if (cargando()) {
    <app-cargando />
  } @else if (filtradas().length === 0) {
    <app-sin-datos mensaje="No hay coberturas para mostrar." icono="health_and_safety" />
  } @else {
    <mat-card class="tabla-card" appearance="outlined">
      <div class="tabla-wrap">
        <table mat-table [dataSource]="filtradas()" class="tabla">
          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let c">{{ c.nombre }}</td>
          </ng-container>
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef class="acciones">Acciones</th>
            <td mat-cell *matCellDef="let c">
              <div class="acciones">
                <button mat-icon-button matTooltip="Editar" (click)="abrirForm(c)">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button matTooltip="Eliminar" (click)="eliminar(c)">
                  <mat-icon>delete</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="columnas"></tr>
          <tr mat-row *matRowDef="let row; columns: columnas"></tr>
        </table>
      </div>
    </mat-card>
  }
</div>
