<app-header (menuToggle)="toggleMenu()" />

<mat-sidenav-container class="shell">
  @if (isAuthenticated()) {
    <mat-sidenav #drawer mode="side" opened class="shell__sidenav">
      <app-menu />
    </mat-sidenav>
  }

  <mat-sidenav-content class="shell__contenido">
    <main class="shell__main" [@routeAnimations]="rutaActual()">
      <router-outlet />
    </main>
    <app-footer />
  </mat-sidenav-content>
</mat-sidenav-container>
