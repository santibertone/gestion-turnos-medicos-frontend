<nav class="menu">
  <div class="menu__cabecera">
    <div class="menu__avatar">{{ (usuario()?.nombre)?.[0] }}{{ (usuario()?.apellido)?.[0] }}</div>
    <div class="menu__datos">
      <span class="menu__nombre">{{ usuario()?.nombre }} {{ usuario()?.apellido }}</span>
      <span class="menu__rol">{{ rol() ? rolLabel[rol()!] : '' }}</span>
    </div>
  </div>

  <mat-nav-list>
    @for (item of items(); track item.ruta) {
      <a
        mat-list-item
        [routerLink]="item.ruta"
        routerLinkActive="menu__activo"
        [routerLinkActiveOptions]="{ exact: item.ruta === '/' }"
        (click)="navegar.emit()"
      >
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </a>
    }
  </mat-nav-list>
</nav>
